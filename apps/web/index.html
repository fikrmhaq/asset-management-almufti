<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asset Management System</title>
    <script>
      /*
       * Theme, applied before first paint.
       *
       * Without this the app renders light, then flips to dark once React
       * mounts. The stored value is read here and the class is set on <html>
       * synchronously; ThemeProvider takes over from the same key afterwards.
       */
      (function () {
        try {
          var stored = localStorage.getItem('assets.theme');
          var choice = stored === 'light' || stored === 'dark' ? stored : 'system';
          var dark =
            choice === 'dark' ||
            (choice === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (error) {
          /* Private mode, storage disabled — the default light theme is fine. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
