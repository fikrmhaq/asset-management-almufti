# OPTIONAL TLS front, as a container.
#
# `05-infrastructure.md` §2 puts Nginx on the HOST, and `nginx/site.conf` is that
# configuration. This overlay is an alternative for servers where installing and
# maintaining host Nginx is not wanted — a Windows host running Docker Desktop,
# or an admin who would rather have one lifecycle for the whole stack.
#
# It is a DEVIATION from the documented topology. Functionally the two are the
# same: TLS terminates in front of the web container, which stays on loopback,
# and Postgres and Redis remain unreachable from the LAN. Choose one, not both —
# they would fight over ports 80 and 443.
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.tls.yml up -d
#
# Requires CERT_DIR in `.env`, holding `server.crt` and `server.key` from
# `scripts/make-cert.sh`.

services:
  tls:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ./nginx/tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/security-headers.conf:/etc/nginx/conf.d/security-headers.conf:ro
      - ${CERT_DIR:?required}:/etc/nginx/certs:ro
    networks: [internal]
    depends_on:
      - web
