# Host-level Nginx for an on-premises deployment — `05-infrastructure.md` §2,
# §12.1, §12.2. This is the topology the documentation describes: Nginx runs ON
# the server, not in a container, and forwards to the web container's published
# loopback port.
#
# Adapted from `deploy/nginx/site.conf` for a network with NO PUBLIC DOMAIN:
#
#   1. No `/.well-known/acme-challenge/` block — certbot cannot validate a name
#      that does not resolve on the public internet.
#   2. The certificate is the locally issued one from `scripts/make-cert.sh`,
#      not a Let's Encrypt path.
#   3. HSTS is commented out. See the note below before enabling it.
#
# Install:
#   sudo cp site.conf /etc/nginx/sites-available/asset-management
#   sudo ln -s /etc/nginx/sites-available/asset-management /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# REPLACE `assets.example.local` with the hostname the institution assigned.

server {
    listen 80;
    listen [::]:80;
    server_name assets.example.local;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name assets.example.local;

    ssl_certificate     /etc/ssl/certs/asset-management.crt;
    ssl_certificate_key /etc/ssl/private/asset-management.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # HSTS IS DELIBERATELY OFF BY DEFAULT.
    #
    # With a certificate clients do not yet trust, HSTS removes the browser's
    # "Proceed anyway" option entirely — Chrome hard-blocks the site with no way
    # through, and clearing that state means editing chrome://net-internals on
    # every machine. Enable it ONLY after the certificate is installed in the
    # client trust stores. Browsers ignore HSTS on a bare IP address, so it is
    # only meaningful if users reach the app by hostname.
    #
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # The web container publishes on 127.0.0.1 only (docker-compose.prod.yml),
    # so this is the single entry point reachable from the LAN — §12.2 requires
    # that Postgres and Redis are never reachable from outside Docker.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 12m;
        proxy_read_timeout 60s;
    }
}
