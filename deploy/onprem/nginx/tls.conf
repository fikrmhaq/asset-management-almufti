# TLS front for the optional `tls` container (docker-compose.tls.yml).
#
# The LAN equivalent of `site.conf`: same job, but it proxies to the `web`
# container over the internal Docker network instead of to a published port, and
# the certificate is a mounted volume instead of a certbot-managed path.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # No ACME challenge location: there is no public CA to answer, and the
    # certificate is issued locally by scripts/make-cert.sh.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # HSTS IS DELIBERATELY OFF BY DEFAULT HERE.
    #
    # With a certificate that clients do not yet trust, HSTS removes the
    # browser's "Proceed anyway" option entirely — Chrome hard-blocks the site
    # with no way through, and clearing it means editing chrome://net-internals
    # on every machine. Turn it on ONLY once the certificate is installed in the
    # client trust stores, and note that browsers ignore HSTS on a bare IP
    # address, so it is only meaningful if users reach the app by hostname.
    #
    # add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/conf.d/security-headers.conf;

    location / {
        # Resolved at REQUEST time, not at startup: with a literal
        # `proxy_pass http://web:80` Nginx resolves the name while loading the
        # config and refuses to start if the web container is not up yet.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_web http://web:80;
        proxy_pass $upstream_web$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        # The API records the client IP on every audit row (DR-015), so the real
        # address has to survive both proxy hops.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Uploads are capped at 10 MB by the application (§5.3); a little more
        # here means the API returns its own typed error rather than a 413.
        client_max_body_size 12m;
        proxy_read_timeout 60s;
    }
}
