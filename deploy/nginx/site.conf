# Host-level Nginx — `05-infrastructure.md` §2, §12.1, §12.2.
#
# Runs ON the VPS, not in a container: it terminates TLS for every site on the
# box and forwards to the web container's published port. Certbot manages the
# certificate and rewrites the `ssl_certificate` lines on first issue.
#
#   sudo certbot --nginx -d assets.example.id
#
# NOT VERIFIED in this repository: there is no VPS, domain or certificate in the
# development environment, so this file is authored from the specification and
# reviewed, not exercised (`IMPLEMENTATION_PLAN.md` §22.8).

# Everything on 80 goes to TLS, except the ACME challenge certbot needs to renew.
server {
    listen 80;
    listen [::]:80;
    server_name assets.example.id;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name assets.example.id;

    ssl_certificate     /etc/letsencrypt/live/assets.example.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/assets.example.id/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # HSTS. Deliberately set at the TLS edge and nowhere else — an application
    # that sets it behind a proxy can end up asserting it over plain HTTP.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # The web container publishes on 127.0.0.1 only (see docker-compose.prod.yml),
    # so this is the single public entry point — §12.2 requires that Postgres and
    # Redis are never reachable from outside the Docker network.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 12m;
    }
}
