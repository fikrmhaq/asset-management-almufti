# Response headers for every static response.
#
# Kept in a separate file and `include`d rather than declared once at server
# level, because of an Nginx rule that is easy to get wrong: `add_header` in a
# `location` REPLACES the inherited set rather than adding to it. The index
# document and the hashed assets both set their own `Cache-Control`, so without
# this include they would silently lose every security header — on exactly the
# responses that matter most.

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
