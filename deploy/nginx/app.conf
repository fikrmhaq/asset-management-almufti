# Nginx server block inside the web container — `05-infrastructure.md` §2.
#
# This is the INNER server: it serves the built React assets and proxies
# `/api/*` to the app container. TLS is terminated by the host-level Nginx in
# front of it (`deploy/nginx/site.conf`, §12.1), which is why nothing here
# listens on 443 or knows about certificates.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The app is served from one origin, so these are set here rather than
    # per-response in Express (helmet still sets its own on API replies).
    include /etc/nginx/conf.d/security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed assets are immutable: a change produces a new filename, so a year
    # of caching is correct and a redeploy invalidates nothing by accident.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/conf.d/security-headers.conf;
        try_files $uri =404;
    }

    # `index.html` must NEVER be cached: it is the document that names the
    # current asset hashes, so a stale copy points a browser at chunks that no
    # longer exist — which, with code splitting (§22.10), breaks navigation
    # rather than merely showing an old page.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        include /etc/nginx/conf.d/security-headers.conf;
        expires 0;
    }

    # Client-side routing: every unknown path is a React Router route, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Resolved at REQUEST time, not at startup. With a literal
        # `proxy_pass http://api:3000`, Nginx resolves the name while loading the
        # config and REFUSES TO START if the API container is not up yet — which
        # would mean an API outage also took down the static frontend, including
        # the error states built to explain an API outage. The variable plus
        # Docker's embedded resolver defers the lookup, so the app always loads
        # and a dead API is a 502 on /api alone.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_api http://api:3000;
        proxy_pass $upstream_api$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        # The API records the client IP on every audit row (`DR-015`), so the
        # real address has to survive the proxy hop — otherwise every entry
        # would read as the container's own address.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Attachment uploads are capped at 10 MB by the application
        # (`05-infrastructure.md` §5.3); allowing a little more here means the
        # API returns its own typed error rather than Nginx returning 413.
        client_max_body_size 12m;

        proxy_read_timeout 60s;
    }
}
