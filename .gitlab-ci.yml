# CI/CD — `05-infrastructure.md` §11; `IMPLEMENTATION_PLAN.md` §22.8.
#
#   lint → test → build → deploy
#
# NOT VERIFIED in this repository: there is no GitLab project, runner or VPS in
# the development environment, so this pipeline is authored from the
# specification and reviewed rather than executed. The commands it runs are the
# same ones used locally throughout the build, which is the part that can be
# checked.

stages: [lint, test, build, deploy]

default:
  image: node:22-alpine
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  before_script:
    - npm ci --cache .npm --prefer-offline

variables:
  # The database tests run against a real PostgreSQL and Redis — they are not
  # mocked, and §11.1's `test` stage is the only safety net before production
  # (§11.3), so they must run here exactly as they run locally.
  POSTGRES_USER: asset_app
  POSTGRES_PASSWORD: asset_app_ci
  POSTGRES_DB: asset_management
  DATABASE_URL: 'postgres://asset_app:asset_app_ci@postgres:5432/asset_management'
  TEST_DATABASE_URL: 'postgres://asset_app:asset_app_ci@postgres:5432/asset_management_test'
  REDIS_URL: 'redis://redis:6379'

lint:
  stage: lint
  script:
    - npm run lint
    - npm run format:check

test:unit:
  stage: test
  script:
    - npm run test:api
    - npm run test:web

test:database:
  stage: test
  services:
    - name: postgres:16-alpine
      alias: postgres
    - name: redis:7-alpine
      alias: redis
  variables:
    STORAGE_PATH: /tmp/storage
    JWT_ACCESS_SECRET: ci-access-secret-that-is-long-enough-000000
    JWT_REFRESH_SECRET: ci-refresh-secret-that-is-long-enough-00000
    CORS_ORIGIN: 'http://localhost:5173'
  script:
    - npm run test:db

build:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -f apps/api/Dockerfile -t "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHA" .
    - >
      docker build -f apps/web/Dockerfile
      --build-arg VITE_API_BASE_URL="$VITE_API_BASE_URL"
      -t "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHA"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy:production:
  stage: deploy
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$DEPLOY_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    # Migrations run ONCE, before the new containers serve traffic (§11.2).
    - >
      ssh "$DEPLOY_USER@$DEPLOY_HOST" "
        cd /opt/asset-management &&
        export API_IMAGE=$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHA &&
        export WEB_IMAGE=$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHA &&
        docker compose -f docker-compose.prod.yml pull &&
        docker compose -f docker-compose.prod.yml run --rm api npm run db:migrate --workspace apps/api &&
        docker compose -f docker-compose.prod.yml up -d
      "
  environment:
    name: production
    url: https://assets.example.id
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      # MANUAL, and §11.3 explains why: there is no staging environment, so the
      # `test` stage is the only gate before production and a human confirms the
      # deploy deliberately.
      when: manual
      allow_failure: false
